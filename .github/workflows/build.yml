name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, package
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # The app icon is an Icon Composer .icon document (Resources/AppIcon.icon), which only
      # Xcode 26's actool can compile — the image default (16.4) builds an icon-less bundle
      # without erroring. Pick the newest 26.x installed on the runner image.
      - name: Select latest Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      # Ghostscript is built from source (AGPL, arm64, self-contained — no Homebrew deps).
      # It is expensive (~5-10 min) and changes only when the build script does, so cache it.
      - name: Cache bundled Ghostscript
        id: gs-cache
        uses: actions/cache@v4
        with:
          path: Resources/ghostscript
          key: ghostscript-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-ghostscript.sh') }}

      - name: Build Ghostscript
        if: steps.gs-cache.outputs.cache-hit != 'true'
        run: scripts/build-ghostscript.sh

      - name: Verify bundled Ghostscript runs self-contained
        run: |
          env -i Resources/ghostscript/bin/gs --version
          # Must link only system dylibs — a Homebrew dep here would break on user machines.
          if otool -L Resources/ghostscript/bin/gs | tail -n +2 | grep -qv -e '/usr/lib/' -e '/System/'; then
            echo "::error::bundled gs links a non-system dylib"; otool -L Resources/ghostscript/bin/gs; exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Test
        run: |
          # pipefail is mandatory: piping xcodebuild into `tail` otherwise returns tail's exit
          # status, so a failing test suite would report success and CI could never go red.
          set -o pipefail
          xcodebuild -project Toolbox.xcodeproj -scheme Toolbox \
            -configuration Debug test | tail -40

      # Tag builds stamp the app with the release's own version — the About panel and
      # UpdateChecker must report the tag the DMG was published under, not whatever
      # project.yml last hard-coded.
      - name: Package DMG
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          fi
          scripts/package-dmg.sh

      # Kept in step with `gate: packaged-app-compresses` in .claude/GATES.md — a private temp
      # dir (never a fixed /tmp path, which a stale bundle could make falsely green), the mount
      # point parsed from hdiutil's plist (a hard-coded /Volumes/Toolbox copies a stale bundle
      # whenever that name is already taken), and a trap that detaches only what was mounted.
      - name: Smoke — the packaged app really compresses a PDF
        run: |
          set -o pipefail
          D="$(mktemp -d)"
          MOUNT=""
          trap '[ -n "$MOUNT" ] && hdiutil detach "$MOUNT" -quiet 2>/dev/null || true; rm -rf "$D"' EXIT
          MOUNT="$(hdiutil attach dist/Toolbox.dmg -nobrowse -plist | grep -A1 '<key>mount-point</key>' | sed -n 's/.*<string>\(.*\)<\/string>.*/\1/p' | head -1)"
          [ -n "$MOUNT" ]
          [ -d "$MOUNT/Toolbox.app" ]
          cp -R "$MOUNT/Toolbox.app" "$D/"
          # Icon must have compiled (an actool too old for .icon documents fails silently).
          [ -f "$D/Toolbox.app/Contents/Resources/AppIcon.icns" ]
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$D/Toolbox.app/Contents/Info.plist" >/dev/null
          # A tag build must report the tag's own version.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            V="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$D/Toolbox.app/Contents/Info.plist")"
            [ "v$V" = "$GITHUB_REF_NAME" ]
          fi
          TOOLBOX_SMOKE=compress "$D/Toolbox.app/Contents/MacOS/Toolbox" | grep -q "SMOKE PASS"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Toolbox-dmg
          path: dist/Toolbox.dmg
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    permissions:
      contents: write
    # Mapped to env so the guard below can test them — the `secrets` context is not dependable
    # inside a step-level `if`.
    env:
      APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
      APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Toolbox-dmg

      # Distribution signing + notarisation. Skipped until the repo owner adds the secrets;
      # the unsigned DMG still publishes so a tag always produces a downloadable build.
      # Requires: APPLE_DEVELOPER_ID (e.g. "Developer ID Application: Name (TEAMID)"),
      # APPLE_CERT_P12 (base64 .p12), APPLE_CERT_PASSWORD, APPLE_API_KEY_ID,
      # APPLE_API_ISSUER_ID, APPLE_API_KEY (base64 .p8).
      - name: Sign and notarise
        if: env.APPLE_DEVELOPER_ID != '' && env.APPLE_CERT_P12 != ''
        run: |
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          echo "$APPLE_CERT_P12" | base64 --decode > cert.p12
          security import cert.p12 -k build.keychain -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci build.keychain
          codesign --force --options runtime --timestamp --sign "$APPLE_DEVELOPER_ID" Toolbox.dmg
          echo "$APPLE_API_KEY" | base64 --decode > key.p8
          xcrun notarytool submit Toolbox.dmg \
            --key key.p8 --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" --wait
          xcrun stapler staple Toolbox.dmg
          rm -f cert.p12 key.p8

      - name: Checksum
        run: shasum -a 256 Toolbox.dmg > Toolbox.dmg.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            Toolbox.dmg
            Toolbox.dmg.sha256
          generate_release_notes: true
          body: |
            **Toolbox** — Compress and OCR PDFs on macOS (Apple Silicon, macOS 14+).

            If macOS reports the app is damaged or from an unidentified developer, this build is
            not notarised: run `xattr -dr com.apple.quarantine /Applications/Toolbox.app`
            after installing, or right-click the app and choose Open.
