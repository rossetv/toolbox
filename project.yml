name: PDFToolbox

options:
  bundleIdPrefix: com.pdftoolbox
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    # Ad-hoc signing only — no Developer ID cert on this machine (0 identities).
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: YES
    CODE_SIGNING_ALLOWED: YES
    DEVELOPMENT_TEAM: ""

targets:
  PDFToolbox:
    type: application
    platform: macOS
    # Glob/directory source discovery — Phase-1 tracks add files without editing project.yml.
    sources:
      - path: Sources/PDFToolbox
      # Blue folder reference — the whole built Ghostscript tree is copied verbatim into
      # the app bundle at Contents/Resources/ghostscript/. Git-ignored; present at build time.
      - path: Resources/ghostscript
        type: folder
        buildPhase: resources
      # App icon. An asset catalog is used rather than a loose .icns because
      # GENERATE_INFOPLIST_FILE offers no INFOPLIST_KEY_ for CFBundleIconFile, and switching to a
      # hand-written Info.plist silently drops every INFOPLIST_KEY_ setting — including the TCC
      # usage strings.
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pdftoolbox.app
        PRODUCT_NAME: PDFToolbox
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_HARDENED_RUNTIME: YES
        # Keys live in Resources/Info.plist: CFBundleName drives the menu-bar name and Xcode
        # derives it from PRODUCT_NAME unless an explicit plist is supplied. The bundle stays
        # PDFToolbox.app — a space in the bundle path breaks TEST_HOST, schemes and scripts.
        # Bundled static libraries (leptonica, jbig2enc) for the Rung-2 bilevel scan pipeline.
        # Built by scripts/build-leptonica.sh + scripts/build-jbig2enc.sh into a git-ignored
        # tree, and linked INTO the app binary — nothing to bundle, nothing to resolve at
        # runtime. jbig2enc is C++ and depends on leptonica, hence its position and -lc++.
        SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/Sources/PDFToolbox/Native/PDFToolbox-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/Resources/native/leptonica/include $(SRCROOT)/Resources/native/jbig2enc/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/Resources/native/leptonica/lib $(SRCROOT)/Resources/native/jbig2enc/lib
        OTHER_LDFLAGS: -ljbig2enc -lleptonica -lc++
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        CLANG_CXX_LIBRARY: libc++

  PDFToolboxTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/PDFToolboxTests
    # Depending on the app target makes this a HOSTED unit-test bundle (XcodeGen wires
    # TEST_HOST + BUNDLE_LOADER), so `@testable import PDFToolbox` resolves the app's symbols.
    dependencies:
      - target: PDFToolbox
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

# Declared explicitly rather than left to inference: renaming the product to "PDF Toolbox"
# silently dropped the test action from the generated scheme, so `xcodebuild test` stopped
# working while every other command still succeeded.
schemes:
  PDFToolbox:
    build:
      targets:
        PDFToolbox: all
        PDFToolboxTests: [test]
    test:
      targets:
        - PDFToolboxTests
    run:
      config: Debug
